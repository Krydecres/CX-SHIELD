name: Survey QR Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Playwright dependencies
        run: npm ci

      - name: Start Spring Boot backend
        run: |
          chmod +x backend/mvnw
          nohup ./backend/mvnw -f backend/pom.xml spring-boot:run > backend.log 2>&1 &

      - name: Wait for backend
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/api/v1/surveys/qr/MC-B04 > /dev/null; then
              echo "Backend is ready!"
              exit 0
            fi
            sleep 5
          done

          echo "Backend failed to start."
          cat backend.log
          exit 1

      - name: Run Survey QR smoke tests
        run: npm run test:smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: survey-qr-smoke-test-report
          path: |
            playwright-report/
            backend.log
          retention-days: 14
