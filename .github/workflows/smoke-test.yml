name: Survey QR Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Playwright dependencies
        run: npm ci

      - name: Start Spring Boot backend
        env:
          SPRING_PROFILES_ACTIVE: smoke
        run: |
          chmod +x backend/mvnw
          nohup ./backend/mvnw -f backend/pom.xml spring-boot:run -Dspring-boot.run.profiles=smoke > backend.log 2>&1 &

      - name: Wait for backend
        run: |
          for i in $(seq 1 60); do
            STATUS=$(curl --silent --output /tmp/backend_resp.json --write-out "%{http_code}" http://localhost:8080/api/v1/surveys/qr/MC-B04 || true)
            if [ "$STATUS" -eq 200 ]; then
              echo "Backend is ready! HTTP status: $STATUS"
              exit 0
            fi
            echo "Attempt $i/60: Backend returned HTTP $STATUS, retrying in 5s..."
            sleep 5
          done

          echo "Backend failed to start after 60 attempts."
          echo "Last response body:"
          cat /tmp/backend_resp.json || true
          echo "=== Backend Log ==="
          cat backend.log
          exit 1

      - name: Run Survey QR smoke tests
        run: npx playwright test e2e/survey_qr_smoke.spec.js

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: survey-qr-smoke-test-report
          path: |
            playwright-report/
            backend.log
          retention-days: 14
