<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CX-SHIELD Review Funnel">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CX-SHIELD">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CX-SHIELD</title>
  <link rel="manifest" href="manifest.json">

  <!-- Script Speech Recognition tiếng Việt trực tiếp từ Micro trình duyệt (Epic 20: Voice Feedback) -->
  <script>
    window.cxShieldSpeech = {
      recognition: null,
      isListening: false,
      start: function() {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          window.dispatchEvent(new CustomEvent('cx_speech_error', { 
            detail: 'Trình duyệt không hỗ trợ Web Speech API. Hãy dùng Google Chrome.' 
          }));
          return false;
        }

        try {
          if (this.recognition) {
            try { this.recognition.abort(); } catch(e) {}
          }

          const rec = new SpeechRec();
          this.recognition = rec;
          rec.lang = 'vi-VN';
          rec.continuous = true;
          rec.interimResults = true;

          rec.onresult = function(event) {
            let fullText = '';
            for (let i = 0; i < event.results.length; ++i) {
              fullText += event.results[i][0].transcript;
            }
            window.dispatchEvent(new CustomEvent('cx_speech_result', { detail: fullText }));
          };

          rec.onerror = function(event) {
            console.warn('SpeechRecognition error:', event.error);
            let msg = event.error;
            if (event.error === 'not-allowed') {
              msg = 'Vui lòng nhấn Cho Phép (Allow) quyền Micro trên trình duyệt để ghi âm.';
            } else if (event.error === 'no-speech') {
              msg = 'Chưa nghe thấy giọng nói, vui lòng thử nói lại gần mic hơn.';
            }
            window.dispatchEvent(new CustomEvent('cx_speech_error', { detail: msg }));
          };

          rec.onend = function() {
            window.cxShieldSpeech.isListening = false;
            window.dispatchEvent(new CustomEvent('cx_speech_end'));
          };

          rec.start();
          this.isListening = true;
          return true;
        } catch(err) {
          window.dispatchEvent(new CustomEvent('cx_speech_error', { detail: err.toString() }));
          return false;
        }
      },
      stop: function() {
        if (this.recognition) {
          try { this.recognition.stop(); } catch(e) {}
        }
        this.isListening = false;
        window.dispatchEvent(new CustomEvent('cx_speech_end'));
      }
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
