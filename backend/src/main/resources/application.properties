spring.application.name=cx-shield-backend
server.port=${PORT:8080}

# Biến môi trường cục bộ đặt trong backend/.env (không commit), xem backend/.env.example
spring.config.import=optional:file:.env[.properties]

cxshield.supabase.url=${SUPABASE_URL:https://rpfuwnwanlbovozkykee.supabase.co}
cxshield.supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY:}
cxshield.supabase.logo-bucket=business-logos
cxshield.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
cxshield.google.places-api-key=${GOOGLE_PLACES_API_KEY:}
cxshield.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# E2.1 / E2.2: gửi cảnh báo qua email. Để trống MAIL_HOST thì kênh Email báo chưa cấu hình.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=5000
cxshield.mail.from=${MAIL_FROM:}

# E8.2: cổng thanh toán VNPAY sandbox
cxshield.vnpay.tmn-code=${VNPAY_TMN_CODE:}
cxshield.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
cxshield.vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
cxshield.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/api/v1/payments/vnpay/return}
cxshield.frontend.url=${FRONTEND_URL:http://localhost:3000}
